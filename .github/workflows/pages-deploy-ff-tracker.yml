# Publishes the Fighting Fantasy Gamebook Tracker PWA (fighting-fantasy-tracker/)
# to GitHub Pages via the modern Actions-based publish flow.
#
# This repo's Pages site previously served the raw repo root via the classic
# "Deploy from a branch" method (that's how web/, the adventure-walking
# site, got published with no build step). A repo can only have one Pages
# source at a time, so this workflow REPLACES that — the tracker becomes
# the entire published site. Requires a one-time manual switch in
# GitHub: Settings -> Pages -> Build and deployment -> Source -> "GitHub
# Actions". Until that's flipped, this workflow builds successfully but
# nothing it uploads goes live.
name: Deploy Fighting Fantasy Tracker to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'fighting-fantasy-tracker/**'
      - '.github/workflows/pages-deploy-ff-tracker.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fighting-fantasy-tracker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: fighting-fantasy-tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fighting-fantasy-tracker/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
